<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/demo :: head('Registration complete')}"></head>

<body class="demo" data-tour-autostart="true">
<div th:replace="~{fragments/demo :: bar('Dynamic Registration', true)}"></div>

<main class="demo-main">
    <p class="demo-eyebrow">LTI Dynamic Registration</p>
    <h1 class="demo-title">Registration complete</h1>
    <p class="demo-lead">The LMS accepted the tool's configuration. Its answer is below.</p>

    <section class="demo-card" data-tour="1" data-tour-title="The LMS's answer">
        <template data-tour-text>
            <p>The LMS echoes the configuration it registered, plus the <code>client_id</code> it assigned. The tool has stored a registration with this client id, so launches from this LMS will be recognized.</p>
            <p>In Canvas, an admin may still need to turn the new developer key on and install the app.</p>
        </template>
        <h2>The LMS's answer</h2>
        <pre class="demo-code" th:text="${@demoFormatter.json(registration_confirmation)}"></pre>
    </section>

    <div class="demo-actions" data-tour="2" data-tour-title="Close the registration window">
        <template data-tour-text>
            <p>The tool tells the LMS it's finished by posting an <code>org.imsglobal.lti.close</code> message to the window that opened it. The LMS then closes this dialog and continues its own setup.</p>
        </template>
        <button type="button" class="demo-button" onclick="confirmRegistration()">Finish and return to the LMS</button>
        <span class="demo-hint" id="close_status" role="status"></span>
    </div>
</main>
<script>
    function confirmRegistration() {
        // For LMSs other than Canvas, the issuer can be used as the targetOrigin instead of '*'.
        (window.opener || window.parent).postMessage({subject: 'org.imsglobal.lti.close'}, '*');
        document.getElementById('close_status').textContent = 'Sent org.imsglobal.lti.close to the LMS.';
    }
</script>
<script type="text/javascript" th:src="@{/js/demoTour.js}"></script>
</body>
</html>
