<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Choose a demo</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}"/>
</head>
<body class="demo">
<div class="demo-bar">
    <span th:text="${@environment.getProperty('application.name', 'Unicon LTI 1.3 Demo')}">Unicon LTI 1.3 Demo</span>
    <span class="demo-badge">Demo mode</span>
</div>

<main class="demo-main">
    <h1 class="demo-title">Who is this demo for?</h1>
    <p>
        Both options run the same LTI 1.3 launch. The only difference is what you see along the way.
    </p>

    <!--
        This form re-sends the platform's login initiation parameters to the same endpoint, plus demo_audience.
        The audience is then stored in the signed state JWT, so it survives the round trip to the LMS without cookies.
        To skip this page, add demo_audience=client or demo_audience=technical to the target link URI,
        or set lti13.defaultDemoAudience.
    -->
    <form method="post" th:action="@{/oidc/login_initiations}">
        <input type="hidden" name="iss" th:value="${initiation_dto.iss}"/>
        <input type="hidden" name="login_hint" th:value="${initiation_dto.loginHint}"/>
        <input type="hidden" name="target_link_uri" th:value="${initiation_dto.targetLinkUri}"/>
        <input type="hidden" name="lti_message_hint" th:value="${initiation_dto.ltiMessageHint}"/>
        <input type="hidden" name="client_id" th:value="${initiation_dto.clientId}"/>
        <input type="hidden" name="deployment_id" th:value="${initiation_dto.deploymentId}"/>
        <input type="hidden" name="lti_deployment_id" th:value="${initiation_dto.ltiDeploymentId}"/>
        <input type="hidden" name="lti_storage_target" th:value="${initiation_dto.ltiStorageTarget}"/>

        <div class="demo-choices">
            <button type="submit" name="demo_audience" value="client" class="demo-choice">
                <strong>Client demo</strong>
                <span>Goes straight to the content, the way a student or instructor would see a real tool.</span>
            </button>
            <button type="submit" name="demo_audience" value="technical" class="demo-choice">
                <strong>Technical walkthrough</strong>
                <span>Pauses at each step of the launch (login initiation, nonce and state checks, ID token) so you can inspect it.</span>
            </button>
        </div>
    </form>
</main>
</body>
</html>
